# Reviewer experiment configuration. Configs/reviewer_experiment.json is the
# canonical machine-readable record used by the reproducibility preflight.
model:
  architecture: "RoBERTa-BiGRU-CRF"
  encoder: "roberta-base"
  max_seq_length: 512
  hidden_layer_neurons: 1536
  dropout: 0.35
  
  bigru:
    dimension: 250
    num_layers: 2
    dropout: 0.35
    use_attention: true
    attention_heads: 8

training:
  optimizer: "AdamW"
  encoder_learning_rate: 3.0e-5
  head_learning_rate: 3.0e-4
  weight_decay: 0.01
  joint_max_epochs: 30
  joint_patience: 5
  relation_refinement_epochs: 12
  relation_refinement_patience: 4
  physical_batch_size: 2
  gradient_accumulation_steps: 2
  run_seed: 42
  selection_data: "validation_only"

task_loss_weights:
  entity: 0.80
  role: 0.05
  relation: 0.15

loss_details:
  emission_ce_weight: 1.5
  o_class_weight_cap: 0.25

relation:
  max_relation_distance: 96

evaluation:
  split_seed: 11800

tagging:
  scheme: "BIEOS"
  sequence_tags: 61
  role_labels:
    - "O"
    - "ROLE_1"
    - "ROLE_2"
    - "ROLE_BOTH"
